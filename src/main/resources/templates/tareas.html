<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>

<body>
    <nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item active" aria-current="page">To-Do List</li>
  </ol>
</nav>
    <div class="container">

    <div class="row">
        <div th:each="tarea : ${tareas}" class="col-md-4 mb-3">

            <div class="card">
                <div class="card-body">

                    <h5 class="card-title" th:text="${tarea.titulo}">
                        Título
                    </h5>

                    <p class="card-text" th:text="${tarea.descripcion}">
                        Descripción
                    </p>

                    <p class="text-muted" th:text="${tarea.fechaInicio}">
                        Fecha
                    </p>
                    <a th:href=@{/tareas/editar/{id}(id=${tarea.id})} class="btn btn-success mt-3">Editar</a>
                    <a th:href=@{tareas/eliminar/{id}(id=${tarea.id})} class="btn btn-danger mt-3">Eliminar</a>

            
                </div>
            </div>

        </div>
    </div>

    <a th:href="@{/tareas/nueva}" class="btn btn-primary mt-3">
        + Nueva Tarea
    </a>

</div>


    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
