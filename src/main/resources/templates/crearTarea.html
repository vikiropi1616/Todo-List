<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
   <nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item active" aria-current="page">Crear Tareas</li>
  </ol>
</nav>

    
    <form th:action="@{/tareas}" th:object="${tarea}" method="post" class="form-group">
        <label for="titulo">Título</label>
        <input type="text" th:field="*{titulo}" id="titulo" class="form-control">
        <label for="descripcion">Descripción:</label>
        <textarea th:field="*{descripcion}" class="form-control" id="descripcion" rows="3"></textarea>

    <br>

    <button type="submit">
        Crear tarea
    </button>
    </form>
</body>
</html>
